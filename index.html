.card-bg{display:block;width:100%}.mode-pick{position:absolute;top:28.65%;width:39%;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .16s ease;filter:drop-shadow(0 .04rem .06rem rgba(0,0,0,.28))}.mode-pick[data-mode=blink]{left:5.8%}.mode-pick[data-mode=tap]{left:55.2%}.mode-pick:active{transform:scale(.955)}@media (hover:hover){.mode-pick:hover{transform:translateY(-1.5%) scale(1.025)}}</style></head><body><canvas id="canvas" class="hide"></canvas><div class="content"><div class="landing loading"><div class="action-1"><img src="./assets/main-index-title.webp?v=20260811-audio-assets" class="title swing"></div><div class="action-2"><div class="load-panel"><div class="load-head">Loading...</div><div class="bar"><div class="fill"></div><div class="pct">0%</div></div><div class="tip"><i>⇒</i> <b>Tip:</b> Stack cakes higher to earn bigger rewards! <i class="flip">⇒</i></div><div class="load-detail"></div></div><img id="start" src="./assets/main-index-start.webp" class="start hide"></div></div><div id="mode" class="mode hide"><div class="card"><img src="./assets/mode-card.webp" class="card-bg" alt="How will you play?" decoding="async"><img class="mode-pick" data-mode="blink" src="./assets/mode-blink.webp" alt="Play by blinking" decoding="async"><img class="mode-pick" data-mode="tap" src="./assets/mode-tap.webp" alt="Play by tapping" decoding="async"></div></div><div id="profile" class="profile hide"><div class="card"><img src="./assets/profile.webp" class="card-bg" decoding="async"><div class="form"><div class="row"><div class="field"><div class="label">Name</div><input id="player-name" class="name-input" type="text" maxlength="12" placeholder="Your name" autocomplete="off" autocapitalize="words" spellcheck="false"></div><div class="field"><div class="label">Company</div><input id="player-company" class="name-input" type="text" maxlength="16" placeholder="Optional" autocomplete="off" autocapitalize="words" spellcheck="false"></div></div><div><div class="label spaced">Pick Your Avatar</div><div id="avatars" class="avatars"></div></div><img id="profile-go" src="./assets/main-index-start.webp" class="go"></div></div></div><div id="modal" class="modal hide"><div class="mask"></div><div class="js-modal-content modal-content"><div id="over-modal" class="result hide"><img src="./assets/result.webp" class="result-bg" alt="Score summary" decoding="async"><i class="rs-spark a"></i><i class="rs-spark b"></i><div class="rs-score"><div class="rs-score-label">Your Score</div><div id="score" class="rs-score-value">0</div></div><div class="rs-stats"><div class="rs-row"><span class="rs-icon rs-icon-tower"><svg viewBox="0 0 24 24"><circle cx="12" cy="4.4" r="1.6" fill="#fff"/><rect x="8.3" y="6.9" width="7.4" height="3.5" rx="1.2" fill="#fff"/><rect x="5.9" y="11.3" width="12.2" height="3.8" rx="1.3" fill="#fff"/><rect x="3.5" y="16" width="17" height="4" rx="1.4" fill="#fff"/></svg></span><span class="rs-label">Tower Height</span><span class="rs-val"><b id="result-height">0</b><em>Layers</em></span></div><div class="rs-row"><span class="rs-icon rs-icon-best"><svg viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.7 6.3.9-4.6 4.4 1.1 6.3-5.6-3-5.6 3 1.1-6.3-4.6-4.4 6.3-.9z" fill="#fff"/></svg></span><span class="rs-label">Best Score</span><span class="rs-val inline"><b id="result-best" class="orange">0</b><i id="result-newbest" class="rs-badge hide">New<br>Best!</i></span></div></div><button type="button" class="rs-btn rs-try js-reload"><svg viewBox="0 0 24 24"><path d="M7 4.3l13.2 7.7L7 19.7z" fill="#fff"/></svg><span>Try Again</span></button><div class="rs-actions"><button type="button" class="rs-btn rs-lead js-leaderboard"><svg viewBox="0 0 24 24"><path d="M7 2.6h10v5.1a5 5 0 0 1-10 0z" fill="#fff"/><path d="M7 4.2H4.2v2.1A3.7 3.7 0 0 0 7.9 10M17 4.2h2.8v2.1A3.7 3.7 0 0 1 16.1 10" stroke="#fff" stroke-width="1.7" fill="none" stroke-linecap="round"/><path d="M10.8 12.2h2.4v3.4h-2.4z" fill="#fff"/><rect x="7.4" y="15.6" width="9.2" height="2.8" rx="1.1" fill="#fff"/></svg><span>Leaderboard</span></button><button type="button" class="rs-btn rs-home js-home"><svg viewBox="0 0 24 24"><path d="M12 3.2L2.6 11.1h2.7v9h5.1v-5.6h3.2v5.6h5.1v-9h2.7z" fill="currentColor"/></svg><span>Home</span></button></div></div><div id="board-modal" class="board hide"><img src="./assets/leaderboard.webp" class="board-bg" alt="Leaderboard" decoding="async"><div id="lb-list" class="lb-list"></div><div class="lb-actions"><button type="button" class="rs-btn rs-home js-home"><svg viewBox="0 0 24 24"><path d="M12 3.2L2.6 11.1h2.7v9h5.1v-5.6h3.2v5.6h5.1v-9h2.7z" fill="currentColor"/></svg><span>Home</span></button><button type="button" class="rs-btn lb-play js-reload"><svg viewBox="0 0 24 24"><path d="M7 4.3l13.2 7.7L7 19.7z" fill="#fff"/></svg><span>Play Again</span></button></div></div></div></div></div><script src="./dist/main.js?v=20260811-ios-media-gate"></script><script src="./assets/zepto-1.1.6.min.js"></script><script src="./assets/leaderboard-client.js"></script><script src="./assets/celebrate.js"></script><script>var domReady, loadFinish, canvasReady, pageReady, vidReady, loadError, gameStart, game, score, successCount
  var gameProgress = 0, pageProgress = 0, vidProgress = 0
  // init window height and width
  var gameWidth = window.innerWidth
  var gameHeight = window.innerHeight
  var ratio = 1.5
  if (gameHeight / gameWidth < ratio) {
    gameWidth = Math.ceil(gameHeight / ratio)
  }
  $('.content').css({ "height": gameHeight + "px", "width": gameWidth + "px" })
  $('.js-modal-content').css({ "width": gameWidth + "px" })
  // The profile card is sized off the play column, not the viewport, so its
  // text and avatar chips scale with the card itself on every screen shape.
  document.documentElement.style.setProperty('--gw', gameWidth + 'px')

  /* Reveal the PLAY button once the DOM, the engine's assets, the page's own
   * artwork and the customer's three clips are all in. Guarded by loadFinish
   * because those arrive on their own clocks and each calls here — running twice
   * used to be harmless, but the replay branch below starts a run, and a second
   * pass would drop the title screen on top of it. */
  function hideLoading() {
    if (loadFinish || !domReady || !canvasReady || !pageReady || !vidReady) return
    $('#canvas').show()
    loadFinish = true
    // Let the bar visibly land on 100% and sit there for the beat before the
    // button takes its place; stopping at 99% and vanishing reads as a hang.
    renderProgress()
    setTimeout(function () {
      /* A replay never sees the title screen. The engine is loaded and its
       * loop is running by now — canvasReady is set on the same 100% tick that
       * fires game.load's callback, a whole second before this — so the run can
       * be started straight from here. See takeReplay. */
      if (replay && game) {
        $('.landing').hide()
        gameStart = true
        game.start()
        // Same as #profile-go: arm the celebration while the screen is still
        // settling, so the mark to beat is in hand before the first landing.
        partyArm()
        return
      }
      /* Coming back from the other edition, the player has already pressed
       * START and already chosen — showing them the title screen again would
       * make them press START twice for one run. Straight to the card. */
      if (modePicked) {
        $('.landing').hide()
        gameStart = true
        profileShow()
        return
      }
      /* Hand .action-2 over from the bar to the PLAY button. The screen around
       * it — backdrop, logo, its swing — has been up since the first frame and
       * stays exactly as it is, so this is the only thing that moves. */
      $('.load-panel').hide()
      $('#start').removeClass('hide')
    }, 600)
  }

  /* The page's own images. The engine's loader never sees these — they are
   * <img> tags and CSS backgrounds, not sprites — so they are warmed here and
   * counted into the same bar. decode() rather than plain onload where it
   * exists: onload means the bytes arrived, decode() means the pixels are ready
   * to paint, and the difference is exactly the hitch this is here to remove.
   * A failure counts as done; a missing medal must not strand the gate. */
  var PAGE_IMAGES = ['background', 'main-bg', 'main-index-title', 'main-index-start',
    'mode-card', 'mode-blink', 'mode-tap', 'profile', 'result', 'leaderboard',
    'medal-1', 'medal-2', 'medal-3',
    'avatar1', 'avatar2', 'avatar3', 'avatar4', 'avatar5', 'avatar6']
  var ASSET_REV = '?v=20260811-audio-assets'

  function pageImageUrl(name) {
    var resized = name === 'main-index-title' || name.indexOf('avatar') === 0
    return './assets/' + name + '.webp' + (resized ? ASSET_REV : '')
  }

  /* The sign is already in the markup and already swinging, so it cannot be
   * waited for like the rest — it has to be faded in where it stands. Its box
   * is reserved in CSS, so nothing below it moves when it appears. */
  function revealTitle() {
    var img = document.querySelector('.landing .title')
    if (!img) return
    var show = function () { img.className += ' ready' }
    if (img.decode) img.decode().then(show, show)
    else if (img.complete) show()
    else { img.onload = show; img.onerror = show }
  }

  function preloadPageImages() {
    revealTitle()
    var done = 0
    function step() {
      done += 1
      pageProgress = done / PAGE_IMAGES.length
      renderProgress()
      if (done === PAGE_IMAGES.length) {
        pageReady = true
        hideLoading()
      }
    }
    PAGE_IMAGES.forEach(function (name) {
      var img = new Image()
      img.onerror = step
      img.src = pageImageUrl(name)
      if (img.decode) {
        img.decode().then(step, step)
      } else {
        img.onload = step
      }
    })
  }

  /* One bar, three sources: the engine's assets, the page's artwork and the
   * customer's clips. The engine's share is the largest because it is the
   * largest download — audio and every sprite — and because the game cannot
   * start without it either way. The clips get the smallest share of the three
   * despite being megabytes each: they stream, so the bar only has to cover the
   * first playable chunk of each one, not the whole file. */
  function renderProgress() {
    var combined = (gameProgress * 0.6) + (pageProgress * 0.25) + (vidProgress * 0.15)
    var pct = loadFinish ? 100 : Math.min(99, Math.round(combined * 100))
    $('.loading .pct').text(pct + '%')
    $('.loading .fill').css({ 'width': pct + '%' })
  }

  function updateLoading(status) {
    var success = status.success
    var total = status.total
    var failed = status.failed
    if (failed > 0 && !loadError) {
      loadError = true
      alert('Network error... Please try again.')
      return
    }
    gameProgress = total > 0 ? success / total : 0
    renderProgress()
    if (gameProgress >= 1 && !canvasReady) {
      canvasReady = true
      hideLoading()
    }
  }

  // ---- game over summary -------------------------------------------------
  // assets/result.webp carries every static part of the card — banner, heading,
  // the two empty boxes and the cake — so only the three numbers and the NEW
  // BEST badge are filled in here. Best score lives in localStorage next to the
  // profile because Try Again reloads the page.
  var BEST_KEY = 'mangoMania.best'

  function readBest() {
    try {
      return parseInt(localStorage.getItem(BEST_KEY), 10) || 0
    } catch (e) {
      return 0
    }
  }

  function overShowOver() {
    var best = readBest()
    var isBest = score > best
    if (isBest) {
      best = score
      try {
        localStorage.setItem(BEST_KEY, best)
      } catch (e) { }
    }
    $('#score').text(score)
    $('#result-height').text(successCount || 0)
    $('#result-best').text(best)
    $('#result-newbest')[isBest ? 'removeClass' : 'addClass']('hide')
    $('#modal').show()
    $('#over-modal').removeClass('hide')

    // Every run is posted, not just personal bests: the server keeps the play
    // history and works out the board from it. Fire and forget — the card is
    // already up, and a failed post parks the run in the client's retry queue.
    if (window.MangoBoard) {
      window.MangoBoard.submit(readProfile(), score, successCount || 0, 'tap')
    }
  }

  /* Take-the-lead celebration. The mark to beat is read once when the run
   * starts, so passing it fires the party exactly once, mid-run — the player
   * sees it while they are still stacking, not on the game-over card. */
  var chase = window.MangoParty ? new window.MangoParty.Chase() : null
  var chaseMine = false

  function partyArm() {
    if (!chase || !window.MangoBoard) return
    chase.arm(null)
    window.MangoBoard.leader().then(function (top) {
      if (!top) return
      // The top score is the mark to beat whether or not the row is already
      // this player's. Passing your own record is still the best anyone has
      // done, and the player who holds first place is the one most likely to
      // beat it — skipping them meant the party almost never fired.
      chaseMine = !!top.mine
      chase.arm(top.score)
    })
  }

  function partyCheck(s) {
    if (!chase || !chase.check(s)) return
    window.MangoParty.fire(document.getElementById('canvas'), {
      title: chaseMine ? 'New best!' : 'You are #1!',
      note: chaseMine
        ? 'You just beat your own record — still top of the board'
        : 'Top of the leaderboard — hold on to it',
      playAudio: function () {
        if (game && game.playAudio) game.playAudio('celebrate')
      }
    })
  }

  // game customization options
  const option = {
    width: gameWidth,
    height: gameHeight,
    canvasId: 'canvas',
    soundOn: true,
    setGameScore: function (s) {
      score = s
      partyCheck(s)
    },
    setGameSuccess: function (s) {
      successCount = s
    },
    setGameFailed: function (f) {
      if (f >= 3) overShowOver()
    },
    /* The customer's clips report in one at a time. Passed in the option rather
     * than assigned to the engine afterwards because the videos start loading
     * inside TowerGame() — by the time it has returned, the first clip may
     * already have arrived and a hook attached then would miss its tick. */
    onCustomerProgress: function (done, total) {
      vidProgress = done / total
      renderProgress()
    }
  }

  // game init with option
  function gameReady() {
    game = TowerGame(option)
    /* The clips are <video>, so game.load() below knows nothing about them and
     * they need their own arm of the gate. Never rejects and times out on its
     * own, so this cannot strand the PLAY button; guarded anyway, because an
     * older bundle in a cache would not have the promise at all. */
    if (game.customerReady) {
      game.customerReady.then(function () {
        vidProgress = 1
        vidReady = true
        renderProgress()
        hideLoading()
      })
    } else {
      vidReady = true
    }
    game.load(function () {
      game.init()
      // Request music now; TowerGame retries it inside the first real gesture.
      // Keeping the policy in one place avoids a muted-autoplay/unlock race.
      game.playBgm()
    }, updateLoading)
  }

  var isWechat = navigator.userAgent.toLowerCase().indexOf("micromessenger") !== -1
  if (isWechat) {
    document.addEventListener("WeixinJSBridgeReady", gameReady, false)
  } else {
    gameReady()
  }

  function indexHide(done) {
    $('.landing .action-1').addClass('slideTop')
    $('.landing .action-2').addClass('slideBottom')
    setTimeout(function () {
      $('.landing').hide()
      // Hand off only once the title and button are actually gone, so the
      // profile card never shares the screen with the sliding menu.
      if (done) done()
    }, 950)
  }

  // ---- player profile ----------------------------------------------------
  // Captured once before play and kept in localStorage so the leaderboard has a
  // name and avatar to attach a score to.
  var PROFILE_KEY = 'mangoMania.profile'
  var AVATARS = ['avatar1', 'avatar2', 'avatar3', 'avatar4', 'avatar5', 'avatar6']
  var pickedAvatar = AVATARS[0]

  function readProfile() {
    try {
      return JSON.parse(localStorage.getItem(PROFILE_KEY)) || null
    } catch (e) {
      // Private mode / disabled storage: play on without a saved profile.
      return null
    }
  }

  function writeProfile(p) {
    try {
      localStorage.setItem(PROFILE_KEY, JSON.stringify(p))
    } catch (e) { }
  }

  window.getPlayerProfile = readProfile

  /* Replay marker. Try Again still goes through a page load — the game has no
   * in-place reset — but it leaves this behind so the fresh page knows to drop
   * the player straight back into a run instead of showing them the title and
   * the profile card again. Everything the card would have asked for is already
   * in localStorage, so there is nothing to re-enter.
   *
   * sessionStorage rather than a URL flag: its lifetime is this tab, which is
   * exactly the lifetime of "I just pressed Try Again". Read once and cleared
   * immediately, so a manual refresh afterwards lands on the title screen like
   * any other visit. A profile is required — with nothing saved there would be
   * no name to put on the board, and the card has to be shown after all.
   */
  var REPLAY_KEY = 'mangoMania.replay'

  function takeReplay() {
    try {
      if (!sessionStorage.getItem(REPLAY_KEY)) return false
      sessionStorage.removeItem(REPLAY_KEY)
    } catch (e) {
      return false
    }
    var p = readProfile()
    return !!(p && p.name)
  }

  function markReplay() {
    try {
      sessionStorage.setItem(REPLAY_KEY, '1')
    } catch (e) { }
  }

  var replay = takeReplay()

  /* ---- control mode -----------------------------------------------------
   * Tap and blink are two PAGES, not two settings — the blink edition carries
   * MediaPipe, a worker and a camera, none of which the tap page should pay
   * for. So choosing is a navigation, and this flag is what survives it: it
   * says "this load is the second half of a choice already made", which lets
   * the page skip its own title screen and chooser and open the profile card
   * directly. Same sessionStorage-once trick as REPLAY_KEY, for the same
   * reason — a manual refresh afterwards should land on the title screen like
   * any other visit. */
  var MODE_KEY = 'mangoMania.mode'

  function takeMode() {
    try {
      if (!sessionStorage.getItem(MODE_KEY)) return false
      sessionStorage.removeItem(MODE_KEY)
      return true
    } catch (e) {
      return false
    }
  }

  var modePicked = takeMode()

  function modeShow() {
    $('#mode').removeClass('hide')
    $('#mode .card').removeClass('popOut').addClass('popIn')
  }

  function modeGo(mode) {
    if (mode === 'blink') {
      try { sessionStorage.setItem(MODE_KEY, '1') } catch (e) { }
      window.location.href = '/blink'
      return
    }
    // Tap is this page: no navigation, just carry on to the profile card.
    $('#mode .card').removeClass('popIn').addClass('popOut')
    setTimeout(function () {
      $('#mode').addClass('hide')
      profileShow()
    }, 300)
  }

  function buildAvatars() {
    var html = ''
    for (var i = 0; i < AVATARS.length; i += 1) {
      html += '<div class="avatar" data-avatar="' + AVATARS[i] + '"><img src="./assets/' + AVATARS[i] + '.webp' + ASSET_REV + '" alt="Avatar ' + (i + 1) + '" decoding="async"></div>'
    }
    $('#avatars').html(html)
    $('#avatars .avatar').on('click', function () {
      pickedAvatar = $(this).attr('data-avatar')
      $('#avatars .avatar').removeClass('on')
      $(this).addClass('on')
    })
  }

  function selectAvatar(a) {
    var i = AVATARS.indexOf(a)
    pickedAvatar = i === -1 ? AVATARS[0] : a
    $('#avatars .avatar').removeClass('on')
    $('#avatars .avatar').eq(i === -1 ? 0 : i).addClass('on')
  }

  function profileShow() {
    var saved = readProfile()
    buildAvatars()
    selectAvatar(saved ? saved.avatar : AVATARS[0])
    if (saved && saved.name) $('#player-name').val(saved.name)
    if (saved && saved.company) $('#player-company').val(saved.company)
    // Toggle the class, not zepto show()/hide(): show() writes an inline
    // display:block that would override the flex centering on .profile.
    $('#profile').removeClass('hide')
    $('#profile .card').removeClass('popOut').addClass('popIn')
  }

  /* Every button ticks. Delegated from the document rather than bound handler
   * by handler: the result and leaderboard buttons are in markup that gets shown
   * and hidden, the avatars are rebuilt from scratch each time the card opens,
   * and a per-handler call would be one more line to forget on the next button.
   * Capture phase so the tick starts even if the handler navigates away.
   *
   * `game` is checked because #start is clickable while the engine is still
   * loading, and playClick is only hung on it once the audio is registered. */
  var CLICKABLE = '#start,#profile-go,.avatar,.rs-btn,.mode-pick'
  document.addEventListener('click', function (e) {
    if (!game || !game.playClick) return
    var el = e.target
    if (!el || !el.closest || !el.closest(CLICKABLE)) return
    game.playClick()
  }, true)

  // click event
  $('#start').on('click', function () {
    if (gameStart) return
    gameStart = true
    indexHide(modeShow)
  })

  $('.mode-pick').on('click', function () {
    modeGo($(this).attr('data-mode'))
  })

  $('#profile-go').on('click', function () {
    var name = ($('#player-name').val() || '').replace(/^\s+|\s+$/g, '')
    if (!name) {
      // Nudge rather than block silently: the leaderboard needs a name.
      var $input = $('#player-name')
      $input.removeClass('shake')
      setTimeout(function () { $input.addClass('shake') }, 0)
      $input.focus()
      return
    }
    var company = ($('#player-company').val() || '').replace(/^\s+|\s+$/g, '')
    writeProfile({
      name: name, company: company, avatar: pickedAvatar, updatedAt: (+new Date())
    })
    $('#player-name').blur()
    $('#player-company').blur()
    $('#profile .card').removeClass('popIn').addClass('popOut')
    setTimeout(function () { $('#profile').addClass('hide') }, 300)
    setTimeout(game.start, 400)
    // Read the mark to beat now, while the card is sliding out, so it is in
    // hand before the first block lands.
    partyArm()
  })

  // Enter on the soft keyboard confirms instead of submitting nothing.
  $('#player-name, #player-company').on('keydown', function (e) {
    if (e.keyCode === 13) $('#profile-go').trigger('click')
  })

  // Neither button can restart in place — the game has no reset — so both go
  // through a page load. What separates them is where that load lands: Try
  // Again marks the reload as a replay and comes back straight into a run as
  // the same player, while Home leaves the mark unset and gets the title
  // screen. The cache-buster is built off pathname, not href, so replaying does
  // not stack up ?s=...?s=... on the URL.
  $('.js-reload').on('click', function () {
    markReplay()
    window.location.href = window.location.pathname + '?s=' + (+new Date())
  })

  $('.js-home').on('click', function () {
    window.location.href = window.location.pathname
  })


  // ---- leaderboard -------------------------------------------------------
  // Global and real: every row comes from /api/leaderboard, which returns one
  // entry per player worldwide — their best run — with the caller's own row
  // already flagged. No filler entries; an empty board says so.

  // The name comes out of a free-text field, so it cannot go into innerHTML raw.
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
    })
  }

  // Rows are built exactly the same way for both the live board and the local
  // fallback: the row builder only cares about name/company/avatar/score/me.
  function lbRow(e, i) {
    return '<div class="lb-row' + (e.me ? ' me' : (i === 0 ? ' gold' : '')) + '"'
      + ' data-key="' + esc(e.key || ('n' + i)) + '">'
      + (i < 3
        ? '<img class="lb-medal" src="./assets/medal-' + (i + 1) + '.webp" alt="' + (i + 1) + '" decoding="async">'
        : '<span class="lb-rank ' + (e.me ? 'mine' : '') + '">' + (i + 1) + '</span>')
      + '<img class="lb-face" src="./assets/' + e.avatar + '.webp' + ASSET_REV + '" alt="" decoding="async">'
      + '<span class="lb-name"><b>' + esc(e.name) + '</b>'
      + (e.company ? '<i>' + esc(e.company) + '</i>' : '') + '</span>'
      // Outside .lb-name on purpose: in the top three a medal replaces the rank
      // pill, so the pill's "mine" colour is gone exactly where it matters most.
      // As a sibling the badge marks the row at every position.
      + (e.me ? '<span class="lb-you">You</span>' : '')
      + '<span class="lb-score">' + e.score + '</span>'
      + '</div>'
  }

  function lbRows(entries) {
    var html = ''
    for (var i = 0; i < entries.length; i += 1) html += lbRow(entries[i], i)
    return html
  }

  // Shown in place of rows when there is nothing to rank, or nothing to reach.
  function lbEmpty(title, note) {
    return '<div class="lb-empty"><b>' + esc(title) + '</b>'
      + (note ? esc(note) : '') + '</div>'
  }

  // Opens on the standings this device saw last, then moves the rows to the
  // current ones. Showing the shuffle is the point: the player watches
  // themselves climb past whoever they passed, the way a console board does.
  function boardRender() {
    var board = document.getElementById('lb-list')
    var seen = window.MangoBoard && window.MangoBoard.snapshot()
    if (seen) $('#lb-list').html(lbRows(seen))
    else $('#lb-list').html(lbEmpty('Loading the board…'))

    if (!window.MangoBoard) return
    // Paced on purpose: the old standings hold for a beat so the player reads
    // them, and only then do the rows move to the new ones.
    window.MangoBoard.paced(window.MangoBoard.top(20)).then(function (res) {
      var rows = res && res.leaderboard ? res.leaderboard : null
      if (!rows) {
        // Server unreachable and nothing cached: say so rather than sit blank.
        if (!seen) $('#lb-list').html(lbEmpty('Board unavailable', 'Check your connection and try again.'))
        return
      }
      if (!rows.length) {
        $('#lb-list').html(lbEmpty('No scores yet', 'Play a round and you will be first on the board.'))
        window.MangoBoard.remember([])
        return
      }

      var was = {}, climbers = {}
      if (seen) {
        var oldSeat = {}
        seen.forEach(function (r, i) { oldSeat[r.key] = i })
        was = window.MangoBoard.positions(board)
        rows.forEach(function (r, i) {
          if (oldSeat[r.key] != null && i < oldSeat[r.key]) climbers[r.key] = true
        })
      }
      $('#lb-list').html(lbRows(rows))
      window.MangoBoard.slide(board, was, climbers)
      window.MangoBoard.remember(rows)
    })
  }

  $('.js-leaderboard').on('click', function () {
    boardRender()
    $('#over-modal').addClass('hide')
    $('#board-modal').removeClass('hide')
  })

  // listener
  window.addEventListener('load', function () {
    domReady = true
    hideLoading()
  }, false);
