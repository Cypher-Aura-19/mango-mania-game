<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, minimal-ui">
<title>Tower Building — Blink Edition</title>
<link rel="icon" type="image/x-icon" href="./assets/favicon.png">
<style>
  * { margin: 0; padding: 0; }
  img { width: 100%; }
  html { background: #fff; height: 100%; }
  body {
    font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
    margin: 0 auto;
    text-align: center;
    width: 100%;
    height: 100%;
    background: #f95240 url(assets/main-bg.png);
    overflow: hidden;
  }
  @media screen and (min-height:560px){ html { font-size: 100px; } }
  @media screen and (min-height:640px){ html { font-size: 112.5px; } }
  @media screen and (min-height:720px){ html { font-size: 125px; } }
  @media screen and (min-height:800px){ html { font-size: 137.5px; } }
  @media screen and (min-height:880px){ html { font-size: 150px; } }
  @media screen and (min-height:960px){ html { font-size: 162.5px; } }
  @media screen and (min-height:1040px){ html { font-size: 180px; } }
  @media screen and (min-height:1200px){ html { font-size: 200px; } }
  html { font-size: 17.6vh; }

  #canvas {
    position: fixed;
    left: 0;
    top: 0;
    right: 0;
    bottom: 0;
    margin: auto;
    width: 100vw;
    height: 100vh;
  }
  a { text-decoration: none; }
  li, ol, ul { list-style-type: none; padding: 0; margin: 0; }
  .hide { display: none; }
  .clear { clear: both; }

  .loading { background-color: #f05a50; height: 100%; width: 100%; }
  .loading .main { width: 60%; margin: 0 auto; color: #fff; }
  .loading .main img { width: 60%; margin: 1rem auto 0; }
  .loading .main .title { font-size: .3rem; }
  .loading .main .text { font-size: .15rem; }
  .loading .main .bar { height: .12rem; width: 100%; border: 3px solid #fff; border-radius: .6rem; margin: .1rem 0; }
  .loading .main .bar .sub { height: .1rem; width: 98%; margin: .008rem auto 0; }
  .loading .main .bar .percent { height: 100%; width: 0; background-color: #fff; border-radius: .6rem; transition: width .2s ease-out; }
  .loading .logo { position: absolute; bottom: .3rem; left: 0; right: 0; }
  .loading .logo img { width: 1rem; }
  .loading .load-detail { margin-top: .06rem; font-size: .14rem; color: rgba(255,255,255,.95); min-height: .2rem; }
  .loading .load-warn { margin-top: .04rem; font-size: .13rem; color: #ffd166; min-height: .18rem; }

  .content { height: 100vh; margin: 0 auto; position: relative; }

  .landing .title { width: 76%; display: block; margin: 0 auto; }
  .landing .action-1 { position: relative; top: -0.9rem; }
  .landing .logo { width: 30%; position: absolute; right: .2rem; top: .2rem; }
  .landing .action-2 { position: absolute; bottom: .15rem; width: 100%; }
  .landing .start { width: 43%; cursor: pointer; filter: drop-shadow(0 .05rem .08rem rgba(0,0,0,.5)); }

  .slideTop { -webkit-animation: st 1s ease-in-out; animation: st 1s ease-in-out; }
  @-webkit-keyframes st { 0% { transform: translateZ(0); } 100% { transform: translate3d(0,-100%,0); } }
  @keyframes st { 0% { transform: translateZ(0); } 100% { transform: translate3d(0,-100%,0); } }
  .slideBottom { -webkit-animation: sb 1s ease-in-out; animation: sb 1s ease-in-out; }
  @-webkit-keyframes sb { 0% { transform: translateZ(0); } 100% { transform: translate3d(0,200%,0); } }
  @keyframes sb { 0% { transform: translateZ(0); } 100% { transform: translate3d(0,200%,0); } }
  .swing { -webkit-animation: sw 1s ease-in-out alternate infinite; animation: sw 1s ease-in-out alternate infinite; }
  @-webkit-keyframes sw { 0% { transform: rotate(15deg); transform-origin: top center; } 100% { transform: rotate(-15deg); transform-origin: top center; } }
  @keyframes sw { 0% { transform: rotate(15deg); transform-origin: top center; } 100% { transform: rotate(-15deg); transform-origin: top center; } }

  .modal .mask { background-color: #000; opacity: .6; position: fixed; height: 100%; width: 100%; top: 0; left: 0; }
  .modal .modal-content { position: fixed; height: 100%; width: 90%; margin-top: .3rem; top: 0; }
  .modal .main { width: 85%; margin: 0 auto; }
  .modal .container { position: relative; }
  .modal .bg { width: 100%; position: absolute; top: 0; left: 0; }
  .modal .modal-main { width: 100%; position: absolute; top: 0; left: 0; margin-top: -.4rem; }
  .modal .over-img { width: 80%; margin: .8rem auto 0; }
  .modal .over-score { margin-top: -.2rem; font-size: .5rem; color: #ff735c; text-shadow: -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff; }
  .modal .tip { font-size: .16rem; color: #9b724e; }
  .modal .over-button-b { width: 70%; margin: .1rem auto 0; cursor: pointer; }

  .wxShare { background: #000; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 11; opacity: .9; }
  .wxShare img { width: 50%; float: right; margin: 10px 10px 0 0; }

  @font-face {
    font-family: wenxue;
    src: url(assets/wenxue.eot);
    src: url(assets/wenxue.eot), url(assets/wenxue.woff), url(assets/wenxue.ttf), url(assets/wenxue.svg);
  }
  .font-wenxue { font-family: wenxue; }

  /* ============================================================
     INVISIBLE WEBCAM — used ONLY for blink detection.
     Never visible to the user: pushed 9999px off-screen to the left.
     IMPORTANT: we do NOT use opacity:0 / z-index:-1 behind opaque
     content, because browsers stop delivering video frames for
     fully-occluded videos, which would freeze blink detection.
     Off-screen keeps frame delivery alive without showing anything.
     ============================================================ */
  #webcam {
    position: fixed;
    left: -9999px;
    top: 0;
    width: 320px;
    height: 240px;
    opacity: 1;
    pointer-events: none;
  }

  /* ============================================================
     TINY CONNECTION DOT — shows blink-control state only.
     Green pulse : face detected, blink ready
     Yellow      : blink engine ready, waiting for your face
     Red         : blink unavailable (camera/model), tap only
     (No face preview, no "you blinked" feedback.)
     ============================================================ */
  #blinkDot {
    position: fixed;
    right: 12px;
    bottom: 12px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ff5252;
    box-shadow: 0 0 6px rgba(255,82,82,.8);
    z-index: 200;
    pointer-events: none;
    transition: background .3s, box-shadow .3s;
  }
  #blinkDot.connecting { background: #ffb300; box-shadow: 0 0 6px rgba(255,179,0,.8); }
  #blinkDot.ready { background: #ffb300; box-shadow: 0 0 6px rgba(255,179,0,.8); }
  #blinkDot.active { background: #00e676; box-shadow: 0 0 6px rgba(0,230,118,.9); }
  #blinkDot.active.pulse { animation: dotPulse 1.2s ease-in-out infinite; }
  @keyframes dotPulse { 0%,100% { box-shadow: 0 0 4px rgba(0,230,118,.6); } 50% { box-shadow: 0 0 10px rgba(0,230,118,1); } }
</style>
</head>
<body>
  <canvas id="canvas" class="hide"></canvas>

  <div class="content">
    <!-- LOADING SCREEN: game assets + blink model + camera all initialize here -->
    <div class="loading">
      <div class="main">
        <img src="./assets/main-loading.gif">
        <div class="progress">
          <div class="title font-wenxue">0%</div>
          <div class="bar"><div class="sub"><div class="percent"></div></div></div>
          <div class="text">Loading...</div>
          <div class="load-detail" id="loadDetail">Preparing…</div>
          <div class="load-warn" id="loadWarn"></div>
        </div>
      </div>
    </div>

    <!-- LANDING SCREEN -->
    <div class="landing hide">
      <div class="action-1"><img src="./assets/main-index-title.webp" class="title swing"></div>
      <div class="action-2">
        <img id="start" src="./assets/main-index-start.webp" class="start">
      </div>
    </div>

    <!-- GAME OVER MODAL -->
    <div id="modal" class="modal hide">
      <div class="mask"></div>
      <div class="js-modal-content modal-content">
        <div class="main">
          <div class="container">
            <img src="./assets/main-modal-bg.png" class="bg">
            <div class="modal-main">
              <div id="over-modal" class="hide js-modal-card">
                <img src="./assets/main-modal-over.png" class="over-img">
                <div id="score" class="over-score font-wenxue"></div>
                <div id="over-zero" class="hide">
                  <div class="tip">
                    <p>Try Again!</p>
                    <img src="./assets/main-modal-again-b.png" class="over-button-b js-reload">
                    <img src="./assets/main-modal-invite-b.png" class="over-button-b js-invite">
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="wxShare hide"><img src="./assets/main-share-icon.png"></div>
  </div>

  <!-- Invisible webcam feed (blink monitoring only — never displayed) -->
  <video id="webcam" autoplay playsinline muted width="320" height="240"></video>

  <!-- Tiny connection state dot -->
  <div id="blinkDot" class="connecting"></div>

  <!-- Tower game bundle (exposes window.TowerGame) -->
  <script src="./dist/main.js"></script>

  <script type="module">
  /* ============================================================
     CONFIG — identical to the working blink POC
     ============================================================ */
  const WASM_PATH = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
  const MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
  const VISION_MJS = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';

  // EAR thresholds (hysteresis to avoid jitter)
  const CLOSE_THRESHOLD = 0.23;   // EAR below => eye considered closed (relaxed to catch quick blinks)
  const OPEN_THRESHOLD  = 0.27;   // EAR above => eye considered open again
  // Blink timing window (ms)
  const MIN_BLINK_MS = 30;        // ignore sub-30ms glitches
  const MAX_BLINK_MS = 500;       // ignore deliberate long closes
  // Minimum gap between accepted blinks (prevents double-trigger)
  const BLINK_COOLDOWN_MS = 300;
  // Detection runs at 30fps for instant response + reliable capture: samples every
  // 33ms so fast blinks are caught, and worst-case latency is ~50ms (instant feel).
  const DETECT_INTERVAL_MS = 1000 / 30;

  /* ============================================================
     DOM REFS
     ============================================================ */
  const video       = document.getElementById('webcam');
  const loadingEl   = document.querySelector('.loading');
  const landingEl   = document.querySelector('.landing');
  const canvasEl    = document.getElementById('canvas');
  const startBtn    = document.getElementById('start');
  const modalEl     = document.getElementById('modal');
  const loadTitle   = document.querySelector('.loading .title');
  const loadBar     = document.querySelector('.loading .percent');
  const loadDetail  = document.getElementById('loadDetail');
  const loadWarn    = document.getElementById('loadWarn');
  const blinkDot    = document.getElementById('blinkDot');

  // Audio unlock state — see unlockAudio() below.
  let audioUnlocked = false;

  /* ============================================================
     STATE
     ============================================================ */
  let blinkWorker = null;   // MediaPipe runs entirely inside this Web Worker
  let workerReady = false;  // worker's model finished loading
  let blinkReady = false;   // model loaded AND camera streaming
  let frameInFlight = false; // don't queue a new frame while one is being processed

  // Blink state machine
  let eyeState = 'OPEN';          // 'OPEN' | 'CLOSED'
  let closeStartTime = 0;
  let lastBlinkTime = 0;
  let lastFaceSeenTime = 0;
  let prevEar = 1;                // last EAR sample, for close-velocity detection

  // Dot state cache — only touch the DOM when it actually changes
  let lastDotState = '';

  // Loading progress (0..1 each; combined for the bar)
  let gameProgress = 0;
  let modelProgress = 0;
  let gameDone = false;
  let modelDone = false;
  let cameraOk = false;
  let cameraDenied = false;
  let allReady = false;

  // Game
  let game = null;
  let gameStart = false;
  let landingShownAt = 0;
  let score = 0;

  /* ============================================================
     CONNECTION DOT STATES
     ============================================================ */
  function setDot(state) {
    if (state === lastDotState) return; // avoid per-frame style churn
    lastDotState = state;
    blinkDot.className = state;
  }

  // Browser autoplay policies block sound until a real user gesture (click,
  // tap, keypress, or a granted media permission). The blink edition is played
  // hands-free — blinks are NOT user gestures — so on its own the page never
  // unlocks audio: no music, no drop sounds. The camera permission grant IS a
  // user gesture, so we unlock all audio the moment the stream goes live (and
  // again on any click/tap/key) instead of waiting for a click that never comes.
  function unlockAudio() {
    if (audioUnlocked || !game) {
      if (game) audioUnlocked = true;
      return;
    }
    audioUnlocked = true;
    // Kick the BGM (muted-start trick is allowed even without a gesture).
    try {
      const bgm = game.getAudio('bgm');
      if (bgm) {
        bgm.muted = true;
        bgm.loop = true;
        const p = bgm.play();
        if (p !== undefined) {
          p.then(() => {
            setTimeout(() => { if (bgm) bgm.muted = false; }, 100);
          }).catch(() => {});
        }
      }
    } catch (e) { /* ignore */ }
    // Warm the SFX elements with a silent play so later drop/game-over sounds
    // aren't blocked by autoplay policy on first use.
    ['drop-perfect', 'drop', 'game-over', 'rotate'].forEach((name) => {
      try {
        const a = game.getAudio(name);
        if (a && a.paused) {
          a.muted = true;
          const p2 = a.play();
          if (p2 !== undefined) p2.catch(() => {});
        }
      } catch (e) { /* ignore */ }
    });
  }

  // Any real user gesture also lets audio through (covers click/tap/keyboard).
  const unlockOnGesture = () => unlockAudio();
  document.addEventListener('click', unlockOnGesture);
  document.addEventListener('touchstart', unlockOnGesture);
  document.addEventListener('keydown', unlockOnGesture);

  function updateBlinkReadiness() {
    const nowReady = workerReady && cameraOk;
    if (nowReady !== blinkReady) {
      blinkReady = nowReady;
      if (blinkReady) {
        setDot('ready'); // amber until a face is seen, then 'active'
      } else {
        setDot('connecting');
      }
    }
  }

  /* ============================================================
     LOADING UI (assets + model share one progress bar)
     ============================================================ */
  function renderProgress() {
    const combined = (gameProgress + modelProgress) / 2;
    const pct = Math.min(99, Math.round(combined * 100));
    loadTitle.textContent = pct + '%';
    loadBar.style.width = pct + '%';

    let detail = 'Preparing…';
    let warn = '';
    if (!gameDone && !modelDone) detail = 'Loading assets & blink engine…';
    else if (!gameDone) detail = 'Loading game assets…';
    else if (!modelDone) detail = 'Loading blink engine…';
    else if (!cameraOk && !cameraDenied) detail = 'Waiting for camera permission…';
    else if (cameraDenied) {
      detail = 'Ready (tap/click to play)';
      warn = '⚠ Camera blocked — blink control off, use tap/click';
    } else detail = 'Ready';

    loadDetail.textContent = detail;
    loadWarn.textContent = warn;
  }

  function checkAllReady() {
    if (allReady) return;
    if (gameDone && modelDone) {
      allReady = true;
      finishLoading();
    }
  }

  function finishLoading() {
    canvasEl.classList.remove('hide');
    setTimeout(() => {
      loadingEl.classList.add('hide');
      landingEl.classList.remove('hide');
      landingShownAt = performance.now();
    }, 1000);
  }

  /* ============================================================
     BLINK DETECTION (invisible — no video, no overlay, no HUD)
     ============================================================ */
  // Fires the action the moment the eye STARTS closing (2-frame confirm),
  // so the block drops instantly at the blink's beginning — no waiting
  // for the eye to reopen. A short cooldown prevents double-triggers.
  function processEar(avgEar, now) {
    // Velocity: how fast the eye is closing since the last sample (positive = closing).
    const closingSpeed = prevEar - avgEar;
    prevEar = avgEar;
    if (eyeState === 'OPEN') {
      // Fire on EITHER a full close (EAR under threshold) OR a fast downward
      // velocity while already dipping — the latter catches the very ONSET of
      // a quick blink, so the drop triggers as your eyes START to close, not
      // after they've shut. avgEar<0.30 gate stops wide-open jitter firing.
      const fastClosing = closingSpeed > 0.045 && avgEar < 0.30;
      if (avgEar < CLOSE_THRESHOLD || fastClosing) {
        eyeState = 'CLOSED';
        closeStartTime = now;
        const nowMs = performance.now();
        if (nowMs - lastBlinkTime >= BLINK_COOLDOWN_MS) {
          lastBlinkTime = nowMs;
          onBlink();
        }
      }
    } else { // CLOSED
      if (avgEar > OPEN_THRESHOLD) {
        eyeState = 'OPEN';
      }
    }
  }

  /** A confirmed blink replaces the tap: start the game or drop the block. */
  function onBlink() {
    if (!blinkReady) return;
    // On landing screen: blink to start (with 1s grace period so an
    // accidental blink while the page settles doesn't start early)
    if (landingEl && !landingEl.classList.contains('hide') && !gameStart && game) {
      if (performance.now() - landingShownAt > 1000) startGame();
      return;
    }
    // During gameplay: same action as a tap/click
    if (gameStart && game) {
      game.touchStartListener();
    }
  }

  // The main thread does almost nothing here: it grabs a small camera frame
  // and ships it to the Web Worker. ALL MediaPipe inference happens off-thread,
  // so the game's render loop is never blocked — smooth as the tap version.
  function detectTick() {
    if (blinkReady && !frameInFlight && video.readyState >= 2 && !video.paused) {
      // createImageBitmap is GPU-backed and cheap; the bitmap is transferred
      // (zero-copy) to the worker, which owns it and closes it after inference.
      createImageBitmap(video).then((bitmap) => {
        frameInFlight = true;
        blinkWorker.postMessage({ type: 'frame', bitmap, ts: performance.now() }, [bitmap]);
      }).catch(() => { /* frame not ready this tick */ });
    }
    setTimeout(detectTick, DETECT_INTERVAL_MS);
  }

  // Handle results coming back from the worker (runs on the main thread, but
  // only does the tiny EAR state machine + a dot update — microseconds).
  function onWorkerMessage(e) {
    const msg = e.data;
    if (msg.type === 'ready') {
      workerReady = true;
      modelProgress = 1;
      modelDone = true;
      console.info('[Blink] Worker model ready (' + msg.delegate + ')');
      updateBlinkReadiness();
      renderProgress();
      checkAllReady();
      return;
    }
    if (msg.type === 'error') {
      console.error('[Blink] Worker failed:', msg.message);
      modelDone = true; modelProgress = 1;
      loadWarn.textContent = '⚠ Blink engine failed to load — tap/click to play';
      renderProgress();
      checkAllReady();
      return;
    }
    if (msg.type === 'result') {
      frameInFlight = false;
      const now = performance.now();
      if (msg.face) {
        lastFaceSeenTime = now;
        setDot('active pulse');
        processEar(msg.avgEar, now);
      } else {
        if (eyeState === 'CLOSED' && lastFaceSeenTime > 0 && now - lastFaceSeenTime > 500) {
          eyeState = 'OPEN';
        }
        prevEar = 1; // reset velocity baseline so a returning face can't false-fire
        if (blinkReady) setDot('ready');
        else setDot('connecting');
      }
    }
  }

  /* ============================================================
     CAMERA (requested during load so permission is handled up front)
     ============================================================ */
  async function startCam() {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 320, max: 320 }, height: { ideal: 240, max: 240 }, facingMode: 'user' },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    cameraOk = true;
    // Camera permission grant is a user gesture -> unlocks autoplay sound.
    unlockAudio();
    console.info('[Blink] Camera ready:', video.videoWidth + 'x' + video.videoHeight);
  }

  async function setupCamera() {
    try {
      // Low-res is plenty for blink detection => faster inference
      await startCam();
    } catch (e) {
      // Some browsers block autoplay until the first user gesture.
      // Retry the camera on the first click/tap so blink control still turns on.
      console.warn('[Blink] Camera start blocked, retrying on first interaction:', e);
      const retryCam = () => {
        document.removeEventListener('click', retryCam);
        document.removeEventListener('touchstart', retryCam);
        startCam()
          .then(() => {
            updateBlinkReadiness();
            renderProgress();
          })
          .catch((e2) => {
            cameraDenied = true;
            console.warn('[Blink] Camera unavailable:', e2);
            updateBlinkReadiness();
            renderProgress();
          });
      };
      document.addEventListener('click', retryCam);
      document.addEventListener('touchstart', retryCam);
      cameraDenied = true; // temporary — hint says "tap to enable blink"
    }
    updateBlinkReadiness();
    renderProgress();
  }

  /* ============================================================
     BLINK MODEL — now lives entirely in a Web Worker so inference
     never touches the main (render) thread. The worker imports the
     MediaPipe module from the CDN, loads the model, and for each frame
     returns just { face, avgEar } — no landmark arrays cross threads.
     ============================================================ */
  function buildWorkerSource() {
    // NOTE: this runs as a CLASSIC worker (not a module worker): MediaPipe
    // loads its WASM via importScripts(), which module workers forbid.
    // We pull the ES module in with dynamic import(), which classic workers allow.
    return `
      let FaceLandmarker = null, FilesetResolver = null;

      const CLOSE_THRESHOLD = ${CLOSE_THRESHOLD};
      const OPEN_THRESHOLD  = ${OPEN_THRESHOLD};
      const LEFT_EYE  = [33, 160, 158, 133, 153, 144];
      const RIGHT_EYE = [362, 385, 387, 263, 373, 380];

      let landmarker = null;
      let lastTs = -1;

      function dist(a, b) { const dx = a.x - b.x, dy = a.y - b.y; return Math.hypot(dx, dy); }
      function ear(lm, idx) {
        const p1 = lm[idx[0]], p2 = lm[idx[1]], p3 = lm[idx[2]];
        const p4 = lm[idx[3]], p5 = lm[idx[4]], p6 = lm[idx[5]];
        return (dist(p2, p6) + dist(p3, p5)) / (2 * dist(p1, p4));
      }

      async function init() {
        const mod = await import('${VISION_MJS}');
        FaceLandmarker = mod.FaceLandmarker;
        FilesetResolver = mod.FilesetResolver;
        const vision = await FilesetResolver.forVisionTasks('${WASM_PATH}');
        const opts = {
          baseOptions: { modelAssetPath: '${MODEL_URL}', delegate: 'GPU' },
          runningMode: 'VIDEO', numFaces: 1,
          minFaceDetectionConfidence: 0.5, minFacePresenceConfidence: 0.5, minTrackingConfidence: 0.5,
          outputFaceBlendshapes: false, outputFacialTransformationMatrixes: false
        };
        let delegate = 'GPU';
        try {
          landmarker = await FaceLandmarker.createFromOptions(vision, opts);
        } catch (gpuErr) {
          delegate = 'CPU';
          opts.baseOptions.delegate = 'CPU';
          landmarker = await FaceLandmarker.createFromOptions(vision, opts);
        }
        self.postMessage({ type: 'ready', delegate });
      }

      self.onmessage = (e) => {
        const msg = e.data;
        if (msg.type !== 'frame') return;
        const { bitmap, ts } = msg;
        if (!landmarker) { bitmap.close(); self.postMessage({ type: 'result', face: false }); return; }
        let face = false, avgEar = 1;
        try {
          const t = ts <= lastTs ? lastTs + 1 : ts;
          lastTs = t;
          const res = landmarker.detectForVideo(bitmap, t);
          if (res && res.faceLandmarks && res.faceLandmarks.length > 0) {
            const lm = res.faceLandmarks[0];
            avgEar = (ear(lm, LEFT_EYE) + ear(lm, RIGHT_EYE)) / 2;
            face = true;
          }
        } catch (err) { /* skip frame */ }
        bitmap.close();
        self.postMessage({ type: 'result', face, avgEar });
      };

      init().catch((err) => self.postMessage({ type: 'error', message: String(err) }));
    `;
  }

  function loadBlinkModel() {
    modelProgress = 0.5;
    renderProgress();
    console.info('[Blink] Spawning blink worker...');
    const src = buildWorkerSource();
    const blobUrl = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
    blinkWorker = new Worker(blobUrl);
    blinkWorker.onmessage = onWorkerMessage;
    blinkWorker.onerror = (err) => {
      console.error('[Blink] Worker error:', err.message);
      modelDone = true; modelProgress = 1;
      loadWarn.textContent = '⚠ Blink engine failed to load — tap/click to play';
      renderProgress();
      checkAllReady();
    };
    modelProgress = 0.7;
    renderProgress();
    // 'ready' / 'error' arrive via onWorkerMessage → sets modelDone.
    return Promise.resolve();
  }

  /* ============================================================
     GAME SETUP (mirrors original index.html logic)
     ============================================================ */
  let gameWidth = window.innerWidth;
  let gameHeight = window.innerHeight;
  const ratio = 1.5;
  if (gameHeight / gameWidth < ratio) {
    gameWidth = Math.ceil(gameHeight / ratio);
  }
  document.querySelector('.content').style.height = gameHeight + 'px';
  document.querySelector('.content').style.width = gameWidth + 'px';
  document.querySelector('.js-modal-content').style.width = gameWidth + 'px';

  const option = {
    width: gameWidth,
    height: gameHeight,
    canvasId: 'canvas',
    soundOn: true,
    // Blink edition only: slow the left-right block motion to ~60% so aiming
    // by blink is easier. The tap edition (index.html) leaves this unset.
    swingSpeedScale: 0.6,
    setGameScore: (s) => { score = s; },
    setGameSuccess: () => {},
    setGameFailed: (f) => {
      document.getElementById('score').textContent = score;
      if (f >= 3) overShowOver();
    }
  };

  function overShowOver() {
    modalEl.classList.remove('hide');
    document.getElementById('over-modal').classList.remove('hide');
    document.getElementById('over-zero').classList.remove('hide');
  }

  function indexHide() {
    document.querySelector('.landing .action-1').classList.add('slideTop');
    document.querySelector('.landing .action-2').classList.add('slideBottom');
    setTimeout(() => { landingEl.classList.add('hide'); }, 950);
  }

  function startGame() {
    if (gameStart) return;
    gameStart = true;
    indexHide();
    setTimeout(() => game.start(), 400);
  }

  function startBgm() {
    const bgmAudio = game.getAudio('bgm');
    if (!bgmAudio) return;
    bgmAudio.muted = true;
    bgmAudio.loop = true;
    const playPromise = bgmAudio.play();
    if (playPromise !== undefined) {
      playPromise.then(() => {
        setTimeout(() => { bgmAudio.muted = false; }, 100);
      }).catch(() => {
        let bgmStarted = false;
        const resumeOnce = () => {
          if (bgmStarted || !game) return;
          bgmStarted = true;
          const audio = game.getAudio('bgm');
          if (!audio || audio.paused) {
            audio.muted = false;
            game.playBgm();
          }
          document.removeEventListener('click', resumeOnce);
          document.removeEventListener('touchstart', resumeOnce);
        };
        document.addEventListener('click', resumeOnce);
        document.addEventListener('touchstart', resumeOnce);
      });
    }
  }

  function initGame() {
    game = TowerGame(option);
    game.load(() => {
      game.init();
      startBgm();
      gameDone = true;
      renderProgress();
      checkAllReady();
    }, (status) => {
      if (status.total > 0) {
        gameProgress = status.success / status.total;
        renderProgress();
      }
    });
  }

  /* ============================================================
     UI EVENTS (click/touch still work as fallback)
     ============================================================ */
  startBtn.addEventListener('click', () => {
    if (gameStart) return;
    startGame();
  });

  document.querySelector('.js-reload').addEventListener('click', () => {
    window.location.href = window.location.href.split('?')[0] + '?s=' + (+new Date());
  });

  document.querySelector('.js-invite').addEventListener('click', () => {
    document.querySelector('.wxShare').classList.remove('hide');
  });

  document.querySelector('.wxShare').addEventListener('click', () => {
    document.querySelector('.wxShare').classList.add('hide');
  });

  /* ============================================================
     INIT — everything happens during the loading screen
     ============================================================ */
  async function init() {
    // 1) Start blink model + camera + game assets in parallel
    const modelPromise = loadBlinkModel().catch((e) => {
      console.error('[Blink] Model load failed:', e);
      modelDone = true;
      modelProgress = 1;
      loadWarn.textContent = '⚠ Blink engine failed to load — tap/click to play';
      renderProgress();
      checkAllReady();
    });

    setupCamera();
    initGame();

    await modelPromise;

    // 2) Start the detection loop as soon as the module script finishes.
    //    It self-guards until model + camera are both live.
    setTimeout(detectTick, DETECT_INTERVAL_MS);

    // 3) If everything finished before we got here, refresh the landing hint.
    updateBlinkReadiness();
  }

  init();
  </script>
</body>
</html>
